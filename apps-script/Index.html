<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projektzentrale · Kleine Schritte</title><meta name="description" content="Projekte, kleine Schritte und Lebensplanung an einem Ort."><style>:root{--ink:#163b44;--muted:#65777c;--line:#dde7e7;--paper:#f5f8f7;--teal:#146c94;--mint:#99ddcc;--green:#1b7469;--amber:#996711}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 'Barlow',system-ui,sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);padding:9px 15px}button:hover{border-color:var(--green)}button.primary{background:var(--green);color:white;border-color:var(--green)}a{color:var(--teal)}aside{position:fixed;width:240px;inset:0 auto 0 0;background:#fff;border-right:1px solid var(--line);padding:34px 22px;display:flex;flex-direction:column}.brand{display:flex;gap:12px;text-decoration:none;color:var(--green);font-size:44px;align-items:center}.brand span{font-size:16px;letter-spacing:3px;line-height:1.3;font-weight:700}.side-label,.eyebrow{font-size:11px;letter-spacing:2px;font-weight:700;color:var(--muted)}.side-label{margin:48px 10px 16px}nav{display:grid;gap:8px}nav button,.side-bottom button{text-align:left;border:0;background:transparent;padding:12px}.selected{background:#e5f3ee!important;color:var(--green);font-weight:650}.side-bottom{margin-top:auto;display:grid;gap:20px}.side-bottom small{padding:10px;color:var(--muted)}main{margin-left:240px;padding:40px 48px;max-width:1600px}header{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:22px}h1{font-size:32px;letter-spacing:-1px;font-weight:650;line-height:1.2;margin:8px 0}h2{font-size:21px;letter-spacing:-.4px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}p{margin:8px 0}.notice{font-size:13px;color:var(--muted);padding:12px 16px;border:1px solid var(--line);border-radius:10px;margin-bottom:26px;background:#fff}.notice.warning{background:#fff8e8;color:#795a25}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:20px 0}.card,.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:22px}.card .big{font-size:33px;font-weight:600}.card small,.muted{color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0}.toolbar .grow{margin-left:auto}input,select,textarea{border:1px solid #cbdada;background:#fff;color:var(--ink);padding:10px;border-radius:8px;max-width:100%}textarea{min-height:94px;resize:vertical}input[type=checkbox]{width:20px;height:20px;accent-color:var(--green);cursor:pointer}.task{display:grid;grid-template-columns:24px 1fr auto;gap:16px;align-items:start;padding:19px 0;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}.task.done .task-title{text-decoration:line-through;color:var(--muted)}.task-title{font-weight:550;display:block;margin-bottom:5px}.task-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted)}.tag{display:inline-block;padding:3px 9px;border-radius:6px;background:#edf4f5;font-size:12px}.tag.aktiv{background:#e0f1e9;color:#17694f}.tag.wartend{background:#fff1d6;color:#886016}.tag.passiv{background:#edf0f2;color:#596974}.tag.abgeschlossen{background:#e6edf8;color:#3566a0}.empty{padding:34px;text-align:center;color:var(--muted)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}.project-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.project-card{display:flex;flex-direction:column;gap:8px}.project-card footer{margin-top:16px;display:flex;justify-content:space-between;align-items:center}.progress{height:5px;background:#e6eeee;border-radius:20px;margin:8px 0}.progress div{height:100%;background:var(--green);border-radius:20px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid var(--line);padding:12px;text-align:left;vertical-align:top}th{color:var(--muted);font-size:12px}dialog{width:min(620px,92vw);border:0;border-radius:16px;padding:26px;box-shadow:0 15px 90px #102e4440;color:var(--ink)}dialog::backdrop{background:#163b4460}.dialog-head{display:flex;justify-content:space-between;gap:20px}.dialog-head button{border:0;font-size:24px;padding:0 10px}#fields{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0}label{display:grid;gap:7px;font-size:14px}.full{grid-column:1/-1}.dialog-actions{display:flex;justify-content:flex-end;gap:10px}.flower{display:block;max-width:460px;width:100%;margin:auto}.life-fields{display:grid;gap:12px}.life-row{display:grid;grid-template-columns:1fr 70px 70px;gap:12px;align-items:center}.life-row input{width:70px;padding:7px}.mini-label{font-size:12px;color:var(--muted)}.year-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.milestone{padding:18px;border:1px solid var(--line);border-radius:10px;margin:12px 0}.milestone-head{display:flex;justify-content:space-between;gap:12px}.milestone ol{padding-left:24px;color:var(--muted)}.flow{display:flex;gap:8px;flex-wrap:wrap}.flow span{font-size:12px;background:#e9f3ef;padding:7px 12px;border-radius:7px}.wordcloud{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px;padding:22px}.wordcloud span{color:var(--green)}#toast{position:fixed;bottom:24px;right:24px;max-width:90vw;background:var(--ink);color:white;border-radius:9px;padding:12px 20px;display:none}.help{font-size:13px;color:var(--muted);margin:12px 0}.danger{color:#a53131}.review{margin-top:24px}.settings-actions{display:flex;flex-wrap:wrap;gap:12px}.pill{border-radius:50px}button:disabled{opacity:.5;cursor:wait}@media(max-width:1000px){aside{width:200px;padding:24px 14px}main{margin-left:200px;padding:30px 24px}.project-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){aside{position:static;width:auto;padding:18px;border-right:0;border-bottom:1px solid var(--line)}.brand{font-size:30px}.brand span{font-size:12px}.side-label,.side-bottom{display:none}nav{display:flex;overflow:auto;margin-top:14px;gap:5px}nav button{white-space:nowrap;font-size:13px;padding:9px}main{margin:0;padding:24px 18px}header{align-items:start}h1{font-size:26px}header button{font-size:13px;white-space:nowrap}.grid2,.project-grid{grid-template-columns:1fr}.cards{gap:8px}.card{padding:14px}.card .big{font-size:26px}.task{gap:10px;grid-template-columns:23px 1fr auto}#fields{grid-template-columns:1fr}.full{grid-column:auto}.toolbar .grow{margin-left:0}.life-row{grid-template-columns:1fr 65px 65px}.flow{gap:5px}}
</style></head>
<body><aside><a class="brand" href="#">◌ <span>PROJEKT<br>ZENTRALE</span></a><p class="side-label">DEIN ÜBERBLICK</p><nav id="nav"><button data-view="tasks" class="selected">☑ Kleine Schritte</button><button data-view="projects">▦ Projekte</button><button data-view="week">◷ Zeit & Woche</button><button data-view="life">✺ Lebensharmonie</button><button data-view="plan">↗ 5-Jahres-Plan</button><button data-view="sources">▤ Wissen & Verlauf</button></nav><div class="side-bottom"><small>Ein Schritt nach dem anderen.<br>Alles bleibt verbunden.</small><button data-view="settings">⚙ Daten & Verbindung</button></div></aside>
<main><header><div><span class="eyebrow" id="date"></span><h1 id="title">Kleine Schritte. Große Richtung.</h1></div><button class="primary" id="newTask">＋ Kleiner Schritt</button></header><div id="mode" class="notice"></div><section id="content"></section></main><div id="toast" role="status" aria-live="polite"></div>
<dialog id="modal"><form id="form"><div class="dialog-head"><h2 id="modalTitle"></h2><button type="button" id="close" aria-label="Schließen">×</button></div><div id="fields"></div><div class="dialog-actions"><button type="button" id="cancel">Abbrechen</button><button class="primary">Speichern</button></div></form></dialog><script>'use strict';
const AREAS=['Energie','Reichtum','Fleiß','Organisation','Liebe','Gesellschaft'];
const COLORS=['#146c94','#6f9dc7','#29b278','#ddba23','#d55e54','#9864b5'];
const STEP_TITLES=['IST-Zustand erfassen','Auf das Wesentliche reduzieren','Online-Business verstehen','Gleichgesinnte finden','Mit Unverständnis umgehen','Finanzielle Unabhängigkeit vorbereiten','Erfolgsregeln verstehen','Wiederkehrendes automatisieren','Zusammenhänge erkennen','Handeln und Freude mitnehmen'];
const KEY='projektzentrale.v1';
const emptyState=()=>({schema:1,projects:[],tasks:[],milestones:[],times:[],reviews:[],sources:[],history:[],alignment:{vision:'',why:'',notWant:'',want:'',skills:'',people:'',words:'Zeit, Freiheit, Familie, Gesundheit, Freude',steps:[],book:false,sleep:56,buffer:7,actual:[0,0,0,0,0,0],target:[0,0,0,0,0,0],feel:[3,3,3,3,3,3]},revision:null});
let state=emptyState(),view='tasks',scope='week',year=1,projectFilter='',search='',busy=false,live=!!(window.google&&google.script&&google.script.run);
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID(),today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Santo_Domingo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
function monday(d=today()){const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()-((x.getUTCDay()+6)%7));return x.toISOString().slice(0,10)}
function weekEnd(){const d=new Date(monday()+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+6);return d.toISOString().slice(0,10)}
const project=id=>state.projects.find(p=>p.id===id),milestone=id=>state.milestones.find(m=>m.id===id),hours=v=>Number(v||0).toLocaleString('de-DE',{maximumFractionDigits:2});
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',4500)}
function rpc(name,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args))}
async function persist(next){if(busy)throw Error('Ein Speichervorgang läuft noch.');busy=true;try{next.schema=1;if(live){const result=await rpc('saveState',next,state.revision);state={...next,revision:result.revision}}else{localStorage.setItem(KEY,JSON.stringify(next));state=next}render()}catch(e){toast('Nicht gespeichert: '+e.message);throw e}finally{busy=false}}
async function change(fn,description){const next=structuredClone(state);fn(next);next.history.unshift({id:uid(),date:new Date().toISOString(),text:description});next.history=next.history.slice(0,250);await persist(next)}
function options(items,chosen=''){return items.map(([value,label])=>`<option value="${esc(value)}" ${value===chosen?'selected':''}>${esc(label)}</option>`).join('')}
function field(name,label,value='',type='text',full=false){return `<label class="${full?'full':''}">${label}<input name="${name}" type="${type}" ${type==='number'?'step="any" min="0"':''} value="${esc(value)}" ${name==='title'?'required maxlength="300"':''}></label>`}
function select(name,label,items,value='',full=false){return `<label class="${full?'full':''}">${label}<select name="${name}">${options(items,value)}</select></label>`}
function areaSelect(value=''){return select('area','Lebensbereich',[['','Noch offen'],...AREAS.map(x=>[x,x])],value)}
function textField(name,label,value=''){return `<label class="full">${label}<textarea name="${name}" maxlength="5000">${esc(value)}</textarea></label>`}
function modal(title,html,submit){$('#modalTitle').textContent=title;$('#fields').innerHTML=html;$('#form').onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;try{await submit(Object.fromEntries(new FormData(e.currentTarget)));$('#modal').close();toast('Gespeichert')}catch(e){toast(e.message)}finally{btn.disabled=false}};$('#modal').showModal()}
function taskForm(id){const t=state.tasks.find(x=>x.id===id)||{id:uid(),status:'Offen',priority:'Normal',scope:'Woche',due:'',projectId:projectFilter};modal(id?'Kleinen Schritt bearbeiten':'Ein kleiner nächster Schritt',field('title','Was möchtest du konkret tun?',t.title||'','text',true)+select('projectId','Projekt',[['','Übergreifend'],...state.projects.map(p=>[p.id,p.title])],t.projectId)+select('milestoneId','Gehört zum Meilenstein',[['','Noch nicht zugeordnet'],...state.milestones.map(m=>[m.id,`${project(m.projectId)?.title||'Lebensplan'} · ${m.title}`])],t.milestoneId)+select('status','Status',[['Offen','Offen'],['Wartend','Wartend'],['Erledigt','Erledigt']],t.status)+select('scope','Einplanen',[['Heute','Heute'],['Woche','Diese Woche'],['Später','Später']],t.scope)+field('due','Termin (optional)',t.due,'date')+select('priority','Priorität',[['Hoch','Hoch'],['Normal','Normal'],['Niedrig','Niedrig']],t.priority)+field('estimate','Geschätzter Aufwand in Stunden',t.estimate||'','number')+areaSelect(t.area)+textField('note','Hinweis / Woran erkenne ich: fertig?',t.note||''),async values=>change(s=>{const updated={...t,...values,estimate:Math.max(0,Number(values.estimate)||0)};const i=s.tasks.findIndex(x=>x.id===t.id);i<0?s.tasks.push(updated):s.tasks[i]=updated},'Kleiner Schritt: '+values.title))}
function projectForm(id){const p=project(id)||{id:uid(),status:'Aktiv',weeklyHours:0};modal(id?'Projekt bearbeiten':'Projekt ergänzen',field('title','Projektname',p.title||'','text',true)+select('status','Status',['Aktiv','Wartend','Passiv','Abgeschlossen'].map(x=>[x,x]),p.status)+areaSelect(p.area)+field('weeklyHours','Zeitbudget pro Woche (Stunden)',p.weeklyHours,'number')+textField('goal','Wofür ist dieses Projekt da?',p.goal||''),async values=>change(s=>{const x={...p,...values,weeklyHours:Math.max(0,Number(values.weeklyHours)||0)};const i=s.projects.findIndex(x=>x.id===p.id);i<0?s.projects.push(x):s.projects[i]=x},'Projekt: '+values.title))}
function timeForm(){modal('Arbeitszeit nachtragen',field('date','Datum',today(),'date')+select('projectId','Projekt',state.projects.map(p=>[p.id,p.title]))+field('hours','Dauer in Stunden, z. B. 0,75','','number')+select('confidence','Wie genau ist die Dauer?',[['Bestätigt','Bestätigt'],['Geschätzt','Geschätzt – noch zu bestätigen']])+textField('note','Woran haben wir gearbeitet?'),async v=>{if(!v.projectId||!Number.isFinite(Number(v.hours))||Number(v.hours)<=0||Number(v.hours)>24||!v.date)throw Error('Bitte Projekt, Datum und eine Dauer zwischen 0 und 24 Stunden angeben.');await change(s=>s.times.push({...v,id:uid(),hours:Number(v.hours)}),'Arbeitszeit nachgetragen')});$('#fields input[name=hours]').step='.25';$('#fields input[name=hours]').required=true}
function milestoneForm(id){const m=milestone(id)||{id:uid(),year,area:'',projectId:''};modal('Meilenstein festlegen',field('title','Welches Ergebnis möchtest du erreichen?',m.title||'','text',true)+select('year','Planungsjahr',[1,2,3,4,5].map(x=>[String(x),'Jahr '+x]),String(m.year))+select('projectId','Projekt',[['','Lebensplan'],...state.projects.map(p=>[p.id,p.title])],m.projectId)+areaSelect(m.area)+field('due','Bis wann?',m.due||'','date')+textField('proof','Woran erkennst du das erreichte Ergebnis?',m.proof||'')+textField('why','Wie dient es deiner Vision?',m.why||''),async v=>change(s=>{if(!id&&s.milestones.filter(x=>Number(x.year)===Number(v.year)).length>=5)throw Error('Für dieses Jahr sind bereits fünf Meilensteine angelegt. Bestehende bitte überarbeiten.');const x={...m,...v,year:Number(v.year)};const i=s.milestones.findIndex(x=>x.id===m.id);i<0?s.milestones.push(x):s.milestones[i]=x},'Meilenstein: '+v.title))}
function taskRows(tasks){return tasks.length?tasks.map(t=>`<article class="task ${t.status==='Erledigt'?'done':''}"><input type="checkbox" aria-label="${esc(t.title)} erledigt" data-check="${esc(t.id)}" ${t.status==='Erledigt'?'checked':''}><div><span class="task-title">${esc(t.title)}</span><div class="task-meta"><span class="tag">${esc(project(t.projectId)?.title||'Übergreifend')}</span>${t.status==='Wartend'?'<span class="tag wartend">Wartend</span>':''}${t.area?`<span>${esc(t.area)}</span>`:''}${t.due?`<span>${t.due<today()&&t.status!=='Erledigt'?'Termin prüfen · ':''}${esc(t.due)}</span>`:''}${t.estimate?`<span>ca. ${hours(t.estimate)} h</span>`:''}${t.priority==='Hoch'?'<span>Priorität hoch</span>':''}</div>${t.note?`<p class="help">${esc(t.note)}</p>`:''}${t.milestoneId?`<small class="muted">↗ ${esc(milestone(t.milestoneId)?.title||'Meilenstein prüfen')}</small>`:''}</div><button data-task="${esc(t.id)}" aria-label="Schritt bearbeiten">⋯</button></article>`).join(''):'<div class="empty">Hier ist Raum für den nächsten kleinen Schritt.</div>'}
function renderTasks(){const open=state.tasks.filter(t=>t.status!=='Erledigt'),planned=open.filter(t=>t.scope==='Heute'||t.scope==='Woche'||(t.due&&t.due<=weekEnd()));let filtered=state.tasks.filter(t=>(!projectFilter||t.projectId===projectFilter)&&(!search||((t.title+' '+(t.note||'')).toLowerCase().includes(search.toLowerCase()))));if(scope==='today')filtered=filtered.filter(t=>t.status!=='Erledigt'&&(t.scope==='Heute'||t.due&&t.due<=today()));if(scope==='week')filtered=filtered.filter(t=>t.status!=='Erledigt'&&(t.scope==='Heute'||t.scope==='Woche'||t.due&&t.due<=weekEnd()));if(scope==='all')filtered=filtered.filter(t=>t.status!=='Erledigt');if(scope==='done')filtered=filtered.filter(t=>t.status==='Erledigt');filtered.sort((a,b)=>(a.status==='Wartend')-(b.status==='Wartend')||(a.priority!=='Hoch')-(b.priority!=='Hoch')||(a.due||'9999').localeCompare(b.due||'9999'));return `<div class="cards"><div class="card"><small>Diese Woche vorgesehen</small><div class="big">${planned.length}</div><small>kleine Schritte über alle Projekte</small></div><div class="card"><small>Aktive Projekte</small><div class="big">${state.projects.filter(p=>p.status==='Aktiv').length}</div><small>bewusst im Fokus</small></div><div class="card"><small>Offene Schritte</small><div class="big">${open.length}</div><small>inklusive später & wartend</small></div></div><div class="toolbar">${[['today','Heute'],['week','Diese Woche'],['all','Alle offen'],['done','Erledigt']].map(([v,l])=>`<button data-scope="${v}" class="${scope===v?'selected':''}">${l}</button>`).join('')}<select id="projectFilter" aria-label="Projektfilter"><option value="">Alle Projekte</option>${options(state.projects.map(p=>[p.id,p.title]),projectFilter)}</select><input id="search" aria-label="Schritte durchsuchen" placeholder="Suchen …" value="${esc(search)}"></div><div class="panel">${taskRows(filtered)}</div><p class="help">Eine gemeinsame Liste. Jeder Schritt bleibt mit seinem Projekt und Meilenstein verbunden.</p>`}
function renderProjects(){return `<div class="toolbar"><p class="muted">Aktiv heißt: diese Woche bekommt es bewusst Zeit.</p><button class="grow primary" id="addProject">＋ Projekt</button></div><div class="project-grid">${state.projects.map(p=>{const ts=state.tasks.filter(t=>t.projectId===p.id),done=ts.filter(t=>t.status==='Erledigt').length;return `<article class="panel project-card"><span class="tag ${p.status.toLowerCase()}">${esc(p.status)}</span><h2>${esc(p.title)}</h2><p class="muted">${esc(p.goal||'Wofür ist dieses Projekt da?')}</p><small>${esc(p.area||'Lebensbereich noch offen')}</small><div class="progress"><div style="width:${ts.length?done/ts.length*100:0}%"></div></div><small>${done} von ${ts.length} Schritten erledigt</small><footer><span>${hours(p.weeklyHours)} h / Woche</span><button data-project="${esc(p.id)}">Bearbeiten</button></footer><button data-show-project="${esc(p.id)}">Schritte ansehen →</button></article>`}).join('')||'<div class="empty">Lege dein erstes Projekt an.</div>'}</div>`}
function renderWeek(){const from=monday(),to=weekEnd(),records=state.times.filter(t=>t.date>=from&&t.date<=to);return `<div class="toolbar"><p class="muted">${from} bis ${to} · America/Santo_Domingo</p><button id="addTime" class="grow primary">＋ Zeit nachtragen</button></div><div class="panel table-wrap"><h2>Wohin geht unsere Arbeitszeit?</h2><table><thead><tr><th>Projekt</th><th>Geplant</th><th>Eingetragen</th><th>Davon geschätzt</th></tr></thead><tbody>${state.projects.map(p=>{const r=records.filter(t=>t.projectId===p.id);return `<tr><td>${esc(p.title)} <span class="tag ${p.status.toLowerCase()}">${esc(p.status)}</span></td><td>${hours(p.weeklyHours)} h</td><td>${hours(r.reduce((s,t)=>s+t.hours,0))} h</td><td>${hours(r.filter(t=>t.confidence==='Geschätzt').reduce((s,t)=>s+t.hours,0))} h</td></tr>`}).join('')}</tbody></table><p class="help">Nachträgliche Einträge genügen. Schätzungen bleiben sichtbar; Chat-Wartezeit wird nicht automatisch als Arbeit gezählt.</p></div><div class="panel review"><h2>Wochenrückblick</h2><p class="muted">Was hat uns weitergebracht? Was braucht nächste Woche mehr Raum?</p><button id="addReview">Rückblick festhalten</button>${state.reviews.slice().reverse().slice(0,4).map(r=>`<p><strong>${esc(r.date)}</strong> · ${esc(r.text)}</p>`).join('')}</div><div class="panel review"><h2>Letzte Zeiteinträge</h2>${records.slice().reverse().map(t=>`<p>${esc(t.date)} · ${esc(project(t.projectId)?.title)} · ${hours(t.hours)} h ${t.confidence==='Geschätzt'?'(geschätzt)':''}<br><small class="muted">${esc(t.note)}</small></p>`).join('')||'<p class="muted">Noch keine Zeit eingetragen.</p>'}</div>`}
function flower(values){const max=Math.max(...values,1),r0=74;return `<svg class="flower" viewBox="0 0 440 440" role="img" aria-label="Lebensblume: sechs Bereiche schneiden den Mittelpunkt Ich bin"><circle cx="220" cy="220" r="194" fill="none" stroke="#cadbd6" stroke-width="1.5"/>${values.map((v,i)=>{const r=v>0?30+v/max*55:0,a=(i*60-90)*Math.PI/180;return `<circle cx="${220+Math.cos(a)*r}" cy="${220+Math.sin(a)*r}" r="${r}" fill="${COLORS[i]}" fill-opacity=".12" stroke="${COLORS[i]}" stroke-width="1.7"/><text x="${220+Math.cos(a)*172}" y="${224+Math.sin(a)*172}" text-anchor="middle" fill="${COLORS[i]}" font-size="13">${esc(AREAS[i])}</text>`}).join('')}<circle cx="220" cy="220" r="4" fill="#1b7469"/><text x="220" y="241" text-anchor="middle" font-size="12" fill="#163b44">Ich bin</text></svg>`}
function renderLife(){const a=state.alignment,total=a.actual.reduce((s,x)=>s+Number(x),0)+Number(a.sleep)+Number(a.buffer),targetTotal=a.target.reduce((s,x)=>s+Number(x),0)+Number(a.sleep)+Number(a.buffer);return `<div class="flow"><span>1 · 10 Schritte</span><span>2 · Buch verstehen</span><span>3 · Ausrichtung</span><span>4 · Planung & Leben</span></div><div class="grid2" style="margin-top:22px"><div class="panel"><h2>Alle Bereiche sind Teil von mir.</h2><p class="muted">Deine Aufmerksamkeit wird sichtbar. Jeder Kreis berührt den gemeinsamen Ursprung.</p>${flower(a.actual)}<p class="help">Darstellung deiner Eingaben als Sinnbild, keine Messung eines physikalischen Energiefelds. Gleich große Kreise sind ein Bild für Ausgewogenheit; dein passendes Zeitverhältnis bestimmst du selbst.</p></div><div class="panel"><h2>168 Stunden. Deine Woche.</h2><div class="life-row mini-label"><span>Lebensbereich</span><span>Ist · h</span><span>Wunsch · h</span></div><form id="lifeForm" class="life-fields">${AREAS.map((x,i)=>`<label class="life-row"><span style="color:${COLORS[i]}">${x}</span><input type="number" min="0" max="168" step=".25" name="actual${i}" value="${a.actual[i]}" aria-label="${x} Ist Stunden"><input type="number" min="0" max="168" step=".25" name="target${i}" value="${a.target[i]}" aria-label="${x} Wunsch Stunden"></label>`).join('')}<label class="life-row"><span>Schlaf / Regeneration</span><input type="number" min="0" max="168" step=".25" name="sleep" value="${a.sleep}"><span class="mini-label">h / Woche</span></label><label class="life-row"><span>Freier Puffer</span><input type="number" min="0" max="168" step=".25" name="buffer" value="${a.buffer}"><span class="mini-label">h / Woche</span></label><p class="${total>168?'danger':'muted'}">Ist: ${hours(total)} / 168 h · ${hours(168-total)} h frei<br>Wunsch: ${hours(targetTotal)} / 168 h · ${hours(168-targetTotal)} h frei</p><button class="primary">Verteilung speichern</button></form><p class="help">Jede Stunde nur einmal zählen. Schlaf wird separat geführt und nicht nochmals Energie zugerechnet.</p></div></div><div class="panel review"><h2>Wie fühlt es sich an?</h2><form id="feelForm" class="life-fields">${AREAS.map((x,i)=>`<label class="life-row"><span>${x}</span><select name="feel${i}" aria-label="${x} persönliches Befinden">${options([1,2,3,4,5].map(n=>[String(n),String(n)]),String(a.feel[i]))}</select><span class="mini-label">1 bis 5</span></label>`).join('')}<button>Reflexion speichern</button></form><p class="help">1 = braucht Aufmerksamkeit · 5 = fühlt sich stimmig an. Mehr Zeit bedeutet nicht automatisch mehr Wohlbefinden.</p></div><div class="panel review"><h2>Vorbereitung & innere Ausrichtung</h2><details><summary>Die 10 Schritte – mein Stand</summary><div class="life-fields" style="margin-top:14px">${STEP_TITLES.map((t,i)=>`<label style="display:flex;align-items:center"><input data-step="${i}" type="checkbox" ${a.steps.includes(i)?'checked':''}>${i+1}. ${t}</label>`).join('')}<label style="display:flex;align-items:center"><input id="book" type="checkbox" ${a.book?'checked':''}>E.R.F.O.L.G.-Prinzip gelesen und reflektiert</label></div></details><form id="alignmentForm" style="margin-top:20px;display:grid;gap:16px">${textField('notWant','Was möchte ich nicht mehr leben?',a.notWant)}${textField('want','Wie möchte ich es stattdessen leben?',a.want)}${textField('skills','Was kann ich gut UND mache ich gerne?',a.skills)}${textField('people','Mein Umfeld: Was stärkt mich, was begrenzt mich?',a.people)}${textField('vision','Meine Vision – bis zu fünf Sätze',a.vision)}${textField('why','Warum ist mir das wichtig?',a.why)}${field('words','Meine Schlüsselwörter (mit Komma trennen)',a.words,'text',true)}<button class="primary">Ausrichtung speichern</button></form></div>`}
function renderPlan(){const a=state.alignment,ms=state.milestones.filter(m=>Number(m.year)===year);return `<div class="panel"><span class="eyebrow">DEINE GROSSE RICHTUNG</span><h2 style="margin-top:12px">${esc(a.vision||'Wie möchte ich leben?')}</h2><p class="muted">${esc(a.why||'Die Vision gibt die Richtung. Meilensteine machen den Fortschritt greifbar.')}</p><div class="wordcloud">${a.words.split(',').filter(x=>x.trim()).slice(0,25).map((w,i)=>`<span style="font-size:${i===0?30:16+(i%3)*3}px">${esc(w.trim())}</span>`).join('')}</div></div><div class="year-tabs">${[1,2,3,4,5].map(y=>`<button data-year="${y}" class="${year===y?'selected':''}">Jahr ${y}</button>`).join('')}<button class="primary" id="addMilestone">＋ Meilenstein</button></div><p class="help">5 Jahre × bis zu 5 Meilensteine × bis zu 5 kleine Schritte = 125. Freie Plätze bleiben frei. Zusätzliche operative Aufgaben gehören in die gemeinsame Aufgabenliste.</p>${ms.map(m=>{const ts=state.tasks.filter(t=>t.milestoneId===m.id);return `<div class="panel milestone"><div class="milestone-head"><div><span class="tag">${esc(m.area||'Bereich offen')}</span><h2 style="margin-top:10px">${esc(m.title)}</h2><p class="muted">${esc(m.proof||'Woran erkenne ich das Ergebnis?')}</p><small>${esc(m.due||'Termin noch offen')} · ${ts.filter(t=>t.status==='Erledigt').length}/${ts.length} Schritte erledigt</small></div><button data-milestone="${m.id}">Bearbeiten</button></div>${taskRows(ts)}<button data-add-step="${m.id}">＋ Schritt zu diesem Meilenstein</button></div>`}).join('')||'<div class="panel empty">Für dieses Jahr ist noch kein Meilenstein festgelegt.</div>'}<div class="panel review"><h2>Im Einklang prüfen</h2><p class="muted">Dient dieser Meilenstein meiner Vision? Welcher Bereich braucht Raum? Passt der nächste Schritt in die Woche? Was darf ich vereinfachen oder verschieben?</p></div>`}
function renderSources(){return `<div class="grid2"><div class="panel"><h2>Wissensregister</h2><p class="help">Gelesen wird nur markiert, wenn der Inhalt tatsächlich vollständig geprüft ist. Geänderte Versionen erneut prüfen.</p><button id="addSource">＋ Quelle</button>${state.sources.map(s=>`<article class="milestone"><strong>${esc(s.title)}</strong><br><span class="tag">${esc(s.status)}</span><p class="help">${esc(s.note||'')}</p><button data-source="${s.id}">Bearbeiten</button></article>`).join('')||'<p class="muted">Noch keine Quellen registriert.</p>'}</div><div class="panel"><h2>Entscheidungen & Änderungen</h2>${state.history.slice(0,35).map(h=>`<p><small class="muted">${esc(new Date(h.date).toLocaleString('de-DE',{timeZone:'America/Santo_Domingo'}))}</small><br>${esc(h.text)}</p>`).join('')||'<p class="muted">Neue Änderungen werden hier mit Datum festgehalten.</p>'}</div></div>`}
function renderSettings(){return `<div class="panel"><h2>Daten & Verbindung</h2><p>${live?'Diese Oberfläche läuft in Google Apps Script und liest und schreibt das verbundene Sheet.':'Diese private Vorschau speichert auf diesem Gerät im Browser. Sie ist noch nicht mit Google Sheets verbunden.'}</p><p class="help">Browserdaten können verloren gehen. Exportiere deine Daten regelmäßig. Bei aktiviertem Sheets-Modus ist das Sheet die gemeinsame führende Datenbasis.</p><div class="settings-actions"><button id="exportData">JSON sichern</button><label class="tag">JSON wiederherstellen<input id="importData" type="file" accept="application/json" style="max-width:230px"></label>${live?'<button id="refresh">Sheet neu laden</button>':''}</div><p class="help">Der vollständige Apps-Script-Adapter ist im Codepaket vorbereitet. Seine Google-Anmeldung und erste Bereitstellung sind noch erforderlich. Es werden keine Zugangsdaten in dieser Oberfläche abgefragt.</p></div><div class="panel review"><h2>Arbeitsweise</h2><p>Projekte und kleine Schritte gemeinsam pflegen. Zeit nachtragen, Unsicherheiten kennzeichnen. Quellen lesen und Versionen dokumentieren. Jede Woche kurz prüfen: Was ist wichtig, was ist realistisch, was fühlt sich stimmig an?</p></div>`}
function render(){const titles={tasks:'Kleine Schritte. Große Richtung.',projects:'Alles an einem Ort.',week:'Zeit bewusst einsetzen.',life:'Mein Leben im Einklang.',plan:'Aus Richtung wird Bewegung.',sources:'Wissen, das bleibt.',settings:'Eine verlässliche Grundlage.'};$('#title').textContent=titles[view];$('#date').textContent=new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',timeZone:'America/Santo_Domingo'}).toUpperCase();$('#mode').textContent=live?'Google Sheets verbunden · gemeinsame Datenbasis':'Private Vorschau · Änderungen werden nur auf diesem Gerät gespeichert · Sheets noch nicht verbunden';$('#mode').className='notice'+(live?'':' warning');$('#content').innerHTML=({tasks:renderTasks,projects:renderProjects,week:renderWeek,life:renderLife,plan:renderPlan,sources:renderSources,settings:renderSettings}[view])();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('selected',b.dataset.view===view));bind()}
function go(v){view=v;render()}
function bind(){document.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{scope=b.dataset.scope;render()});document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>taskForm(b.dataset.task));document.querySelectorAll('[data-project]').forEach(b=>b.onclick=()=>projectForm(b.dataset.project));document.querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>change(s=>{s.tasks.find(t=>t.id===b.dataset.check).status=b.checked?'Erledigt':'Offen'},b.checked?'Schritt erledigt':'Schritt wieder geöffnet').catch(()=>render()));document.querySelectorAll('[data-show-project]').forEach(b=>b.onclick=()=>{projectFilter=b.dataset.showProject;scope='all';go('tasks')});document.querySelectorAll('[data-year]').forEach(b=>b.onclick=()=>{year=Number(b.dataset.year);render()});document.querySelectorAll('[data-milestone]').forEach(b=>b.onclick=()=>milestoneForm(b.dataset.milestone));document.querySelectorAll('[data-add-step]').forEach(b=>b.onclick=()=>{if(state.tasks.filter(t=>t.milestoneId===b.dataset.addStep).length>=5){toast('Fünf Schritte zugeordnet. Weitere operative Aufgaben über die gemeinsame Liste anlegen.');return}taskForm();$('#fields [name=milestoneId]').value=b.dataset.addStep;$('#fields [name=projectId]').value=milestone(b.dataset.addStep)?.projectId||''});const bindId=(id,fn)=>{if($('#'+id))$('#'+id).onclick=fn};bindId('addProject',()=>projectForm());bindId('addTime',timeForm);bindId('addMilestone',()=>milestoneForm());bindId('addReview',()=>modal('Wochenrückblick',field('date','Datum',today(),'date')+textField('text','Was lief gut? Was ändern wir nächste Woche?'),v=>change(s=>s.reviews.push({...v,id:uid()}),'Wochenrückblick festgehalten')));if($('#projectFilter'))$('#projectFilter').onchange=e=>{projectFilter=e.target.value;render()};if($('#search'))$('#search').oninput=e=>{const pos=e.target.selectionStart;search=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)};for(const formId of ['alignmentForm','lifeForm','feelForm']){const f=$('#'+formId);if(f)f.onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(f));try{await change(s=>{if(formId==='alignmentForm')Object.assign(s.alignment,v);if(formId==='lifeForm'){const actual=AREAS.map((_,i)=>Number(v['actual'+i])),target=AREAS.map((_,i)=>Number(v['target'+i])),sleep=Number(v.sleep),buffer=Number(v.buffer);if([...actual,...target,sleep,buffer].some(x=>!Number.isFinite(x)||x<0)||actual.reduce((s,x)=>s+x,0)+sleep+buffer>168||target.reduce((s,x)=>s+x,0)+sleep+buffer>168)throw Error('Die Woche hat 168 Stunden. Bitte Verteilung reduzieren.');Object.assign(s.alignment,{actual,target,sleep,buffer})}if(formId==='feelForm')s.alignment.feel=AREAS.map((_,i)=>Number(v['feel'+i]))},'Ausrichtung aktualisiert');toast('Gespeichert')}catch(e){toast(e.message)}}}document.querySelectorAll('[data-step]').forEach(b=>b.onchange=()=>change(s=>{const i=Number(b.dataset.step);s.alignment.steps=b.checked?[...new Set([...s.alignment.steps,i])]:s.alignment.steps.filter(x=>x!==i)},'Vorbereitung aktualisiert').catch(()=>render()));if($('#book'))$('#book').onchange=e=>change(s=>s.alignment.book=e.target.checked,'Buchreflexion aktualisiert').catch(()=>render());bindId('addSource',()=>sourceForm());document.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>sourceForm(b.dataset.source));bindId('exportData',()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=url;a.download='projektzentrale-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});if($('#importData'))$('#importData').onchange=async e=>{try{const raw=JSON.parse(await e.target.files[0].text());validateState(raw);modal('Sicherung wiederherstellen','<p class="full">Die Sicherung ersetzt den aktuellen App-Datenstand. Bestehende Daten bitte vorher exportieren.</p>',()=>persist({...raw,revision:state.revision}))}catch(err){toast('Import nicht möglich: '+err.message)}};bindId('refresh',loadState)}
function sourceForm(id){const s=state.sources.find(x=>x.id===id)||{id:uid(),status:'Offen'};modal('Quelle dokumentieren',field('title','Datei / Quelle',s.title||'','text',true)+select('status','Lesestand',[['Offen','Offen'],['Teilweise gelesen','Teilweise gelesen'],['Vollständig gelesen','Vollständig gelesen'],['Geändert – erneut lesen','Geändert – erneut lesen']],s.status)+textField('note','Version, Kernaussage und offene Fragen',s.note||''),v=>change(st=>{const x={...s,...v},i=st.sources.findIndex(x=>x.id===s.id);i<0?st.sources.push(x):st.sources[i]=x},'Quellenregister aktualisiert'))}
function validateState(s){if(!s||s.schema!==1||!s.alignment||!['projects','tasks','milestones','times','reviews','sources','history'].every(k=>Array.isArray(s[k])&&s[k].length<=5000))throw Error('Ungültiges Datenformat.');if(!['actual','target','feel'].every(k=>Array.isArray(s.alignment[k])&&s.alignment[k].length===6))throw Error('Die sechs Lebensbereiche fehlen.');if(!Array.isArray(s.alignment.steps)||typeof s.alignment.words!=='string')throw Error('Ausrichtung unvollständig.');for(const k of ['projects','tasks','milestones','times','reviews','sources','history'])for(const r of s[k])if(!r||typeof r.id!=='string'||typeof r!=='object')throw Error('Ungültiger Datensatz.');for(const t of s.times)if(!Number.isFinite(t.hours)||t.hours<=0||t.hours>24)throw Error('Ungültiger Zeiteintrag.');return s}
async function loadState(){try{if(live)state=validateState(await rpc('getState'));else{const saved=localStorage.getItem(KEY);if(saved)state=validateState(JSON.parse(saved));else {try{const r=await fetch('draft-data.json');if(r.ok)state=validateState(await r.json())}catch{}}}render()}catch(e){$('#mode').textContent='Daten konnten nicht geladen werden: '+e.message;$('#mode').className='notice warning';$('#content').innerHTML='<div class="panel">Bitte Verbindung prüfen und erneut laden. Bestehende Daten werden nicht überschrieben.</div>';$('#newTask').disabled=true}}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));$('#newTask').onclick=()=>taskForm();$('#close').onclick=$('#cancel').onclick=()=>$('#modal').close();loadState();
</script></body></html>
